{% extends "base.html" %}
{% load i18n %}
{% block title %}{{ headline }}{% endblock %}
{% block content %}

<div class="mx-auto max-w-md">
    <div class="rounded-2xl border border-gray-200 bg-white p-8 text-center shadow-sm">
        <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-brand-50">
            <i data-feather="info" class="h-7 w-7 text-brand-600"></i>
        </div>
        <h1 class="mb-3 text-lg font-semibold text-gray-900">{{ headline }}</h1>
        <p class="mb-2 text-sm text-gray-700">{{ object }}</p>
        {% if description %}
        <p class="mb-6 text-sm text-gray-500">{{ description }}</p>
        {% endif %}
        <div class="flex items-center justify-center gap-3">
            <a href="{% url 'list_contests' %}"
               class="inline-flex items-center justify-center rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 shadow-sm transition hover:bg-gray-50">
                {% trans "Cancel" %}
            </a>
            <form method="post" class="inline-flex">
                {% csrf_token %}
                <button type="submit"
                        class="inline-flex items-center justify-center rounded-lg bg-brand-600 px-4 py-2 text-sm font-medium text-white shadow-sm transition hover:bg-brand-700">
                    {{ action_label }}
                </button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
