{% extends "base.html" %}
{% load i18n %}
{% block title %}{{ template_data.header }}{% endblock %}
{% block content %}

<h1 class="mb-6 text-2xl font-bold text-gray-900">{{ template_data.header }}</h1>

<form method="post" novalidate class="mx-auto max-w-3xl">
    {% csrf_token %}

    <div class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm">
        <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
            {% for field in form %}
                {% include "includes/form_field.html" %}
            {% endfor %}
        </div>
    </div>

    <div class="mt-6 flex items-center justify-end gap-3">
        <a href="{% url 'list_articles' %}"
           class="inline-flex items-center justify-center rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 shadow-sm transition hover:bg-gray-50">
            {% trans "Cancel" %}
        </a>
        <button type="submit"
                class="inline-flex items-center justify-center rounded-lg bg-brand-600 px-4 py-2 text-sm font-medium text-white shadow-sm transition hover:bg-brand-700">
            {% trans "Save Article" %}
        </button>
    </div>
</form>

{% endblock %}
