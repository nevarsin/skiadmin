{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Delete" %} {{ type }}{% endblock %}
{% block content %}

<div class="mx-auto max-w-md">
    <div class="rounded-2xl border border-gray-200 bg-white p-8 text-center shadow-sm">
        <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-red-50">
            <i data-feather="alert-triangle" class="h-7 w-7 text-red-500"></i>
        </div>
        <h1 class="mb-2 text-lg font-semibold text-gray-900">
            {% trans "Are you sure you want to delete this" %} {{ type }}?
        </h1>
        <p class="mb-6 text-sm text-gray-500">{{ object }}</p>
        <div class="flex items-center justify-center gap-3">
            <a href="javascript:history.back();"
               class="inline-flex items-center justify-center rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 shadow-sm transition hover:bg-gray-50">
                {% trans "Cancel" %}
            </a>
            <form method="post" class="inline-flex">
                {% csrf_token %}
                <button type="submit"
                        class="inline-flex items-center justify-center rounded-lg bg-red-600 px-4 py-2 text-sm font-medium text-white shadow-sm transition hover:bg-red-700">
                    <i data-feather="trash-2" class="mr-1.5 h-4 w-4"></i>
                    {% trans "Yes, Delete" %}
                </button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
