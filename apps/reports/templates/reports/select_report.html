{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Select Report" %}{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg">
    <h1 class="mb-6 text-2xl font-bold text-gray-900">{% trans "Select Report" %}</h1>

    <form method="post" class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <div class="space-y-5">
            {% for field in form %}
                {% include "includes/form_field.html" %}
            {% endfor %}
        </div>
        <button type="submit"
                class="mt-6 inline-flex items-center justify-center gap-2 rounded-lg bg-brand-600 px-4 py-2 text-sm font-medium text-white shadow-sm transition hover:bg-brand-700">
            {% trans "Next" %}
            <i data-feather="arrow-right" class="h-4 w-4"></i>
        </button>
    </form>
</div>
{% endblock %}
